# DS Video Revival – Einbindung in DSMs eigenen Webserver (Ports 5000/5001 und
# eigene DSM-Domains), wie früher Video Station. Eingebunden über den DSM-
# Ressourcen-Worker „web-config“ (Typ dsm); DSM bleibt auf seinen Ports, mit
# seinem Zertifikat. Weitergereicht an das Paket (127.0.0.1:@PORT@) werden nur:
#  * alle WebAPI-Aufrufe der DS-video-Apps (erkannt am User-Agent, z.B.
#    „Synology-DS_video_…“ oder „DS%20video/… CFNetwork“); das Paket beantwortet
#    Video Station selbst und reicht alles andere (Anmeldung usw.) an DSM zurück,
#    gekennzeichnet mit X-DSVR-Loop, damit es hier nicht erneut umgeleitet wird,
#  * /webapi/VideoStation/… (gibt es in DSM nicht mehr; z.B. Videostream des
#    iOS-Players mit dessen eigenem User-Agent),
#  * /webapi/_dsvr/… (Pfade, die das Paket den Apps meldet),
#  * /jellyfin/… – die Jellyfin-Schnittstelle für Jellyfin-Apps (Infuse,
#    Swiftfin …), z.B. https://nas:5001/jellyfin; nur aktiv, wenn sie in der
#    Weboberfläche eingeschaltet ist (sonst antwortet das Paket mit 404),
#  * /dsvr/… – die Weboberfläche (Mediathek und Verwaltung) unter der DSM-
#    Adresse, z.B. https://nas:5001/dsvr/ – so auch von unterwegs über
#    QuickConnect, DynDNS oder eine eigene DSM-Domain (Anmeldung wie bisher
#    mit dem DSM-Konto).
# Alle anderen Apps und die DSM-Oberfläche bleiben unberührt.

set $dsvr_route "";
if ($http_user_agent ~* "DS([ _.-]|%20)?video|dsvideo") {
    set $dsvr_route "app";
}
if ($http_x_dsvr_loop) {
    set $dsvr_route "";
}
if ($dsvr_route = "app") {
    rewrite ^/webapi/(?!_dsvr/)(.*)$ /webapi/_dsvr/$1 last;
}
rewrite ^/webapi/VideoStation/(.*)$ /webapi/_dsvr/VideoStation/$1 last;
# Video-Station-Aufrufe ohne App-User-Agent (z.B. Videostream des iOS-Players
# an entry.cgi): am API-Namen in der Adresse erkennen.
if ($arg_api ~* "^SYNO\.VideoStation") {
    rewrite ^/webapi/(?!_dsvr/)(.*)$ /webapi/_dsvr/$1 last;
}

location ^~ /webapi/_dsvr/ {
    proxy_pass http://127.0.0.1:@PORT@;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # Player mit großem Puffer (z.B. Sony-Player auf Android TV) oder ein
    # vorgeschalteter Reverse-Proxy lesen minutenlang nichts; nginx bricht
    # die Antwort sonst nach 60 s (Standard) ab → „unexpected end of stream“.
    send_timeout 3600s;
    client_max_body_size 0;
}

location ^~ /jellyfin/ {
    proxy_pass http://127.0.0.1:@PORT@;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    send_timeout 3600s;
    client_max_body_size 1m;
}

# Weboberfläche. X-DSVR-Via kennzeichnet den Weg über DSM: Das Paket liefert
# dann Pfade, die hier ankommen (Videos der Mediathek über /webapi/_dsvr/hls/).
# /dsvr ohne Schrägstrich leitet das Paket selbst um (relative Adresse, passt
# auch hinter QuickConnect).
location = /dsvr {
    proxy_pass http://127.0.0.1:@PORT@;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-DSVR-Via dsm;
}

location ^~ /dsvr/ {
    proxy_pass http://127.0.0.1:@PORT@;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-DSVR-Via dsm;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    send_timeout 3600s;
    client_max_body_size 2m;
}
